	     this one file for arbitrary paths at arbitrary depths. -->

	<link rel="icon" href="/_assets/site/favicon.png" type="image/png" sizes="32x32">

		@font-face { font-family: "Garamond"; src: url("/_fonts/garamond.ttf"); }

		html, body { margin: 0; padding: 0; height: 100%; }

			display: flex;

			background: #FFFFFF;

		}

			font-size: 18px;

			color: #AAAAAA;

		}

		a:hover { color: #666666; }
	</style>

</head>
<body>
